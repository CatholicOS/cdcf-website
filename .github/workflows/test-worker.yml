name: bats (queue worker)

# Runs the bats-core suite over scripts/cdcf_queue_worker.lib.sh helpers
# and the compose-config tests, instruments them with kcov, and uploads
# cobertura coverage to Codecov under the `worker` flag (refs #91 Phase 2).
#
# This job now GATES. #63 landed it non-blocking (continue-on-error) with
# the note "watch them stabilize, then flip the gate in a follow-up" — this
# is that follow-up. Two things were wrong while it was non-blocking, and
# both are fixed here:
#
#   1. It could not fail. continue-on-error made the job report success
#      whatever the tests did.
#   2. It reported nothing. Running bats *under* kcov meant kcov captured
#      bats' stdout, so no TAP (1..N / ok N / not ok N) ever reached the
#      log — for ANY test file. A green check was not evidence a single
#      test had run, let alone passed.
#
# So bats now runs twice: once directly (the gate and the visible record),
# once under kcov (measurement only, never the gate).
#
# All interpolations are repo-controlled identifiers used as concurrency-
# group keys, not shelled out. No untrusted github.event.* inputs.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cdcf_queue_worker*'
      - 'scripts/tests/**'
      - 'docker-compose.yml'
      - '.github/workflows/test-worker.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cdcf_queue_worker*'
      - 'scripts/tests/**'
      - 'docker-compose.yml'
      - '.github/workflows/test-worker.yml'

concurrency:
  group: test-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    # Pinned to 22.04 because kcov was dropped from Ubuntu noble (24.04)
    # universe. When 22.04 retires, either switch back to ubuntu-latest
    # and build kcov from source (~1-2 min overhead) or pick up a future
    # runner image that ships kcov preinstalled.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code (with bats-core submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Verify python3 is available
        # parse_processed / parse_domain_count tests use the real python3
        # interpreter — they exercise the actual JSON parser, not a shim.
        run: |
          which python3
          python3 --version

      - name: Install kcov
        # kcov instruments bash scripts and emits cobertura.xml for Codecov.
        # Available in the Ubuntu apt archive; no PPA needed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kcov

      - name: Run bats
        # THE GATE. Runs bats directly so its TAP output reaches the log and
        # a non-zero exit fails the job. Do not fold this back into the kcov
        # step: kcov captures bats' stdout, which is what made this suite
        # silent and unverifiable for every test it contained.
        run: ./scripts/tests/bats/bin/bats scripts/tests/*.bats

      - name: Measure coverage under kcov
        # MEASUREMENT ONLY — never the gate; the step above already ran the
        # tests and decided. kcov struggles with bats' run-in-subshell test
        # helper unless each .bats file is invoked separately, so we loop and
        # merge. The include pattern restricts measurement to the worker
        # scripts — bats internals, shims, and python helpers are excluded.
        # continue-on-error is at STEP level and scoped to coverage: a kcov
        # failure must not fail a build whose tests passed.
        continue-on-error: true
        run: |
          mkdir -p coverage
          for f in scripts/tests/*.bats; do
            name=$(basename "$f" .bats)
            kcov \
              --include-pattern=cdcf_queue_worker \
              --bash-dont-parse-binary-dir \
              "coverage/${name}" \
              scripts/tests/bats/bin/bats "$f" || true
          done
          kcov --merge coverage/merged coverage/*/

      - name: Upload coverage to Codecov (worker flag)
        # if: always() so coverage uploads even when a bats test fails.
        # `fail_ci_if_error: false` matches the policy used by the other
        # test workflows — Codecov outages don't fail the build.
        # `disable_search: true` stops the action from auto-discovering
        # additional coverage files in the workspace — without it, the
        # per-bats-file kcov outputs and bats-core's own report.xml from
        # the submodule get uploaded alongside the merged cobertura.xml
        # and pollute the worker flag's numbers.
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/merged/kcov-merged/cobertura.xml
          flags: worker
          fail_ci_if_error: false
          disable_search: true
