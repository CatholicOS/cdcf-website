version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group co-coupled packages so per-package PRs don't fail npm install
    # on peer-dependency conflicts. Concrete failure that motivated this:
    # @tiptap/pm@3.26.1 and @tiptap/starter-kit@3.26.1 individually
    # conflict with @tiptap/react@3.26.0's peer-dep requirement on
    # @tiptap/core@3.26.0 (npm ERESOLVE) — but bumped together they
    # install cleanly. PRs #211 and #213 sat open with failing CI for
    # this reason.
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
      # Same failure mode: @vitest/coverage-v8@X peers on exactly vitest@X,
      # so a solo coverage-v8 bump can't install (PR #315).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # react-dom refuses to run against any react but its own exact
      # version ("Incompatible React versions"), so a solo bump breaks
      # every component test: #379 moved react to 19.3.1 and left
      # react-dom on 19.3.0 until #381.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
