# Single-origin proxy for the local Zitadel stack, mirroring the internal
# proxy cdcf-infra runs in production (auth/nginx/zitadel.conf).
#
# Routing:
#   /ui/v2/login*   -> ghcr.io/zitadel/zitadel-login (v2 UI, port 3000)
#   everything else -> ghcr.io/zitadel/zitadel       (backend, port 8080)
#
# Service names resolve because compose puts every service on a default
# user-defined network.
#
# Differences from production, all consequences of local being plain HTTP on
# a non-default port:
#   * X-Forwarded-Proto is http, matching ZITADEL_EXTERNALSECURE=false.
#     Sending https here makes Zitadel mint https:// issuer and redirect
#     URLs that the browser cannot reach over the local port.
#   * Host AND X-Forwarded-Host are both $http_host, NOT $host. Zitadel
#     mints its issuer and every endpoint URL from the forwarded host, and
#     nginx's $host drops the port. Either header left as $host yields
#     `issuer: http://localhost` and Auth.js fails discovery with "issuer
#     property does not match the expected value" against
#     AUTH_ZITADEL_ISSUER=http://localhost:8090. X-Forwarded-Host wins when
#     both are present, so fixing only Host is not enough. Production uses
#     $host safely only because it serves on 443, where the port is absent
#     from the URL anyway.
#   * The CSP connect-src allows http://localhost:3000 (the Next.js dev
#     server) instead of the deployed property origins.

upstream zitadel_backend {
    server zitadel:8080;
}

upstream zitadel_login {
    server zitadel-login:3000;
}

server {
    listen 80 default_server;
    server_name _;

    # Room for org/project assets uploaded through the admin console.
    client_max_body_size 10m;

    # Login V2 UI — Next.js app served under the /ui/v2/login prefix.
    location /ui/v2/login {
        proxy_pass http://zitadel_login;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection '';

        # zitadel-login ships `connect-src 'self'`, which blocks the Next.js
        # RSC prefetch when the post-login 302 lands on a different-origin
        # OIDC client. Locally that client is the dev server on :3000, a
        # different origin from :8090. Login still succeeds via a full
        # navigation, but DevTools fills with CSP violations that mask real
        # errors. Mirror the upstream policy and widen connect-src only.
        # proxy_hide_header is required: multiple CSP headers intersect, so
        # appending one would not widen anything.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:3000; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' http://zitadel:8080; frame-ancestors 'none'; object-src 'none'" always;
    }

    # Everything else — the Zitadel backend: admin console at /ui/console,
    # OIDC at /oidc/v1, OAuth at /oauth/v2, management API at /management/v1.
    location / {
        proxy_pass http://zitadel_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
